AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Cloud Foundations (Week 4): CI/CD Pipeline Automation Stack.
  Provisions AWS CodePipeline, AWS CodeBuild, S3 Artifact Storage, and IAM Service Roles
  to automate testing and continuous deployment to AWS Elastic Beanstalk.
  Author: Sakshi Bhalekar

Parameters:
  EBApplicationName:
    Type: String
    Default: cloud-week4-node-app
    Description: Name of the target Elastic Beanstalk Application.

  EBEnvironmentName:
    Type: String
    Default: cloud-week4-prod-env
    Description: Name of the target Elastic Beanstalk Environment.

  GitHubRepo:
    Type: String
    Default: week-4
    Description: GitHub Repository name.

  GitHubOwner:
    Type: String
    Default: SakshiBhalekar
    Description: GitHub Username or Organization.

  GitHubBranch:
    Type: String
    Default: main
    Description: Target branch to trigger automated pipeline execution.

  ConnectionArn:
    Type: String
    Default: ""
    Description: Optional AWS CodeStar Connection ARN for GitHub v2 integration.

Conditions:
  HasConnectionArn: !Not [!Equals [!Ref ConnectionArn, ""]]

Resources:
  # =========================================================================
  # ARTIFACT S3 BUCKET
  # =========================================================================
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-pipeline-artifacts-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: CleanOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  # =========================================================================
  # IAM SERVICE ROLES
  # =========================================================================
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildBasePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-codepipeline-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelineServicePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt CodeBuildProject.Arn
              - Effect: Allow
                Action:
                  - elasticbeanstalk:*
                  - ec2:*
                  - autoscaling:*
                  - cloudformation:*
                  - s3:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: "*"

  # =========================================================================
  # AWS CODEBUILD PROJECT
  # =========================================================================
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-build-and-test"
      Description: Builds Node.js application, executes unit tests, and packages artifact
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: NODE_ENV
            Value: production
          - Name: EB_APP_NAME
            Value: !Ref EBApplicationName
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      TimeoutInMinutes: 15

  # =========================================================================
  # AWS CODEPIPELINE (3 STAGES)
  # =========================================================================
  DeploymentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${AWS::StackName}-pipeline"
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        # Stage 1: Source
        - Name: Source
          Actions:
            - !If
              - HasConnectionArn
              - Name: GitHubSource
                ActionTypeId:
                  Category: Source
                  Owner: AWS
                  Provider: CodeStarSourceConnection
                  Version: '1'
                Configuration:
                  ConnectionArn: !Ref ConnectionArn
                  FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepo}"
                  BranchName: !Ref GitHubBranch
                OutputArtifacts:
                  - Name: SourceOutput
                RunOrder: 1
              - Name: S3Source
                ActionTypeId:
                  Category: Source
                  Owner: AWS
                  Provider: S3
                  Version: '1'
                Configuration:
                  S3Bucket: !Ref ArtifactBucket
                  S3ObjectKey: source/app-source.zip
                OutputArtifacts:
                  - Name: SourceOutput
                RunOrder: 1

        # Stage 2: Test & Build
        - Name: Build-And-Test
          Actions:
            - Name: RunTestsAndPackage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref CodeBuildProject
              RunOrder: 1

        # Stage 3: Elastic Beanstalk Deploy
        - Name: Production-Deploy
          Actions:
            - Name: DeployToElasticBeanstalk
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ElasticBeanstalk
                Version: '1'
              InputArtifacts:
                - Name: BuildOutput
              Configuration:
                ApplicationName: !Ref EBApplicationName
                EnvironmentName: !Ref EBEnvironmentName
              RunOrder: 1

Outputs:
  PipelineName:
    Description: Created AWS CodePipeline Name
    Value: !Ref DeploymentPipeline

  PipelineUrl:
    Description: Console URL to inspect the live CI/CD pipeline
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${DeploymentPipeline}/view"

  ArtifactBucketName:
    Description: S3 Artifact Bucket Name
    Value: !Ref ArtifactBucket
